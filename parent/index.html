<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>متابعة البنات</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6f5c">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F8;--card:#fff;--ink:#1B2333;--muted:#667085;--line:#E4E7EE;--brand:#1f6f5c;
  --ok:#14945A;--ok-soft:#E3F6EC;--mid:#B87700;--mid-soft:#FFF4DC;--bad:#D8384A;--bad-soft:#FDE8EA;
  --n:#5b5bd6;--l:#e0457b;--t:#2DB3A6}
@media (prefers-color-scheme:dark){:root{--bg:#10141C;--card:#1A2030;--ink:#E9ECF3;--muted:#9AA3B5;--line:#2A3245;--brand:#4fc3a1;
  --ok:#3CCB86;--ok-soft:#173326;--mid:#F2B544;--mid-soft:#3A2E14;--bad:#FF6B7B;--bad-soft:#3D1D22}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;font-size:15px;line-height:1.6}
header{background:var(--brand);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:5}
header h1{margin:0 0 10px;font-size:19px;font-weight:800}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs button{flex:1;min-width:70px;border:0;background:transparent;color:#ffffffcc;font:inherit;font-weight:700;padding:8px 6px 10px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:#fff;border-bottom-color:#fff}
main{max-width:760px;margin:0 auto;padding:14px 12px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:12px 0 6px}
.muted{color:var(--muted)}.tiny{font-size:12.5px}
.hide{display:none!important}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:12px}
.kid{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:12px;cursor:pointer}
.kid .nm{font-weight:800;font-size:17px}.kid .gr{color:var(--muted);font-size:12.5px;margin-top:-2px}
.stats{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.stat{flex:1;min-width:60px;background:var(--bg);border-radius:10px;padding:6px 8px;text-align:center}
.stat b{display:block;font-size:18px}.stat span{font-size:11.5px;color:var(--muted)}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.mid{background:var(--mid-soft);color:var(--mid)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.who{display:inline-block;padding:0 8px;border-radius:99px;color:#fff;font-size:12px;font-weight:700;background:var(--c)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{min-width:0}.item .t small{display:block;color:var(--muted);font-size:12px}
.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden;width:90px;flex:none}
.bar i{display:block;height:100%;background:var(--ok)}.bar.mid i{background:var(--mid)}.bar.bad i{background:var(--bad)}
.subj{font-weight:800;margin:10px 0 2px;padding-top:6px;border-top:1px dashed var(--line)}
.subj:first-child{border-top:0;margin-top:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--muted);font-weight:600}
td.n{text-align:center}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
textarea,input{width:100%;font:inherit;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:80px;direction:ltr}
details summary{cursor:pointer;color:var(--brand);font-weight:700;padding:6px 0}
.code{direction:ltr;unicode-bidi:isolate;display:inline-block}
#pin{max-width:340px;margin:60px auto;text-align:center}
#pin input{text-align:center;font-size:22px;letter-spacing:6px;margin:10px 0}
</style>
</head>
<body>
<section id="pin" class="card">
  <h2>متابعة البنات 🔒</h2>
  <p class="muted tiny" id="pinHint"></p>
  <input id="pinIn" type="password" inputmode="numeric" autocomplete="off">
  <button class="btn" id="pinBtn">دخول</button>
  <div id="pinMsg" class="tiny" style="color:var(--bad);margin-top:6px"></div>
</section>

<div id="app" class="hide">
<header><h1>متابعة البنات 👨‍👧‍👧</h1>
  <nav class="tabs" id="tabs"><button data-t="all" class="on">الكل</button><button data-t="noreen">نورين</button><button data-t="logeen">لوجين</button><button data-t="taleen">تالين</button></nav>
</header>
<main>
  <div id="vAll">
    <div class="kids" id="kids"></div>
    <div class="card"><h2>⚠️ محتاج تركيز</h2><div id="weak"></div></div>
    <div class="card"><h2>آخر النتايج</h2><div id="recent"></div></div>
    <div class="card"><h2>آخر التحديثات على الأسئلة</h2><div id="upd"></div></div>
    <div class="card">
      <h2>إضافة نتيجة من واتساب</h2>
      <p class="muted tiny" style="margin:0 0 8px">الزق رسالة النتيجة كلها، من أي بنت (MP1- أو LG3- أو TK1-). الصفحة هتعرف هي نتيجة مين، وهتظهر كمان في صفحة البنت.</p>
      <textarea id="impText"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn" id="impBtn">إضافة النتيجة</button><span id="impMsg" class="tiny"></span></div>
    </div>
  </div>
  <div id="vKid" class="hide"></div>
</main>
</div>

function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s);return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)));}
// decode a WhatsApp code into the same shape the girl's own page stores
function decode(k,text){const m=String(text).match(new RegExp(k.d.prefix+'-([A-Za-z0-9_-]+)'));if(!m)return null;
  const o=JSON.parse(b64d(m[1]));const per={};let c=0,t=0;
  Object.entries(o.p||{}).forEach(([id,v])=>{if(!k.LMAP[id]||!Array.isArray(v))return;const tt=Math.max(0,+v[1]||0),cc=Math.max(0,Math.min(+v[0]||0,tt));per[id]={c:cc,t:tt};c+=cc;t+=tt;});
  if(!t)return null;
  const id=String(o.i||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,40)||('a'+Date.now().toString(36));
  const ts=isNaN(Date.parse(o.s))?new Date().toISOString():new Date(o.s).toISOString();
  const w=(o.w||[]).filter(x=>typeof x==='string').slice(0,60);
  const a={id,mode:String(o.m||''),ts,total:t,correct:c,pct:Math.round(c/t*100),perLesson:per,minutes:+o.mi||null};
  if(k.id==='taleen')a.wrong=w;else{a.name=String(o.n||'').slice(0,40);a.wrong=w.map(x=>({id:x,ans:''}));a.via='whatsapp';}
  return a;}
function attemptsOf(k){const loc=LS.get(k.d.key+'_attempts',[]);const base=(k.d.track.results||[]).map(c=>{try{return decode(k,c)}catch(e){return null}}).filter(Boolean);
  return [...loc,...base.filter(b=>!loc.some(a=>a.id===b.id))].sort((x,y)=>x.ts<y.ts?-1:1);}
function modeName(k,m){m=String(m||'');
  if(k.id==='taleen'){if(m.startsWith('ALL:')){const s=k.SMAP[m.slice(4)];return (s?s.ar:'')+' · التحدي الكبير';}const l=k.LMAP[m];return l?k.SMAP[l.s].ar+' · '+l.ar:m;}
  if(m==='all'||m==='u1'||m==='u2')m='math:'+m;
  if(m.startsWith('L:')){const l=k.LMAP[m.slice(2)];return l?`${k.SMAP[l.s].ar} · تدريب <span class="code">${esc(l.code)}</span> ${esc(l.ar)}`:'تدريب';}
  const [sj,part]=m.split(':');const x=k.SMAP[sj];if(!x)return esc(m);
  return esc(x.ar)+' · '+(part==='all'?'امتحان شامل':'امتحان الوحدة '+esc((part||'').slice(1)));}
function lname(k,l){return (l.code?`<span class="code">${esc(l.code)}</span> · `:'')+esc(l.ar);}
// latest % per lesson, with first % and count
function hist(all){const h={};all.forEach(a=>Object.entries(a.perLesson||{}).forEach(([id,x])=>{if(x.t)(h[id]=h[id]||[]).push(Math.round(x.c/x.t*100));}));return h;}

function summary(k){const all=attemptsOf(k),h=hist(all),ids=Object.keys(h);
  const lasts=ids.map(id=>h[id][h[id].length-1]);
  return {all,h,avg:lasts.length?Math.round(lasts.reduce((a,b)=>a+b,0)/lasts.length):null,
    weak:ids.filter(id=>h[id][h[id].length-1]<85).map(id=>({k,l:k.LMAP[id],p:h[id][h[id].length-1],n:h[id].length})).filter(x=>x.l),
    last:all[all.length-1]};}

   <div class="card"><h2>خطة التطوير 📈</h2>${plan?`<table><tr><th>الدرس</th><th>المستوى</th><th>تحديثات</th></tr>${plan}</table>`:'<p class="muted" style="margin:0">لسه مفيش تحديثات مستوى.</p>'}
    <h3>سجل التحديثات</h3>${(k.d.track.updates||[]).slice().reverse().map(u=>`<div class="item" style="align-items:flex-start"><div class="t"><span class="pill">${esc(u.d)}</span> <span class="tiny">${esc(u.note)}</span></div></div>`).join('')||'<p class="muted">لسه.</p>'}</div>
   <div class="card"><h2>كل الاختبارات</h2>${s.all.length?s.all.slice().reverse().map(a=>`<details><summary style="color:var(--ink);font-weight:600"><span class="pill ${lvc(a.pct)}">${a.correct}/${a.total} · ${a.pct}%</span> ${modeName(k,a.mode)} <span class="tiny muted">${fmt(a.ts)}</span></summary><table>${Object.entries(a.perLesson).map(([id,x])=>{const l=k.LMAP[id],p=Math.round(x.c/x.t*100);return `<tr><td>${l?lname(k,l):esc(id)}</td><td class="n">${x.c}/${x.t}</td><td class="n"><span class="pill ${lvc(p)}">${p}%</span></td></tr>`}).join('')}</table></details>`).join(''):'<p class="muted" style="margin:0">لسه.</p>'}</div>`;
}

function tab(t){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('#vAll').classList.toggle('hide',t!=='all');$('#vKid').classList.toggle('hide',t==='all');
  if(t==='all')renderAll();else renderKid(K[t]);window.scrollTo(0,0);}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));

$('#impBtn').onclick=()=>{const m=$('#impMsg'),txt=$('#impText').value;let k=null,a=null;
  for(const x of KIDS){try{a=decode(x,txt)}catch(e){a=null}if(a){k=x;break;}}
  if(!a){m.style.color='var(--bad)';m.textContent='مش لاقي كود نتيجة صحيح. اتأكد إنك لزقت الرسالة كلها.';return;}
  const key=k.d.key+'_attempts',loc=LS.get(key,[]);
  if(attemptsOf(k).some(x=>x.id===a.id)){m.style.color='var(--mid)';m.textContent=`نتيجة ${k.name} دي متضافة قبل كده.`;return;}
  loc.push(a);LS.set(key,loc);m.style.color='var(--ok)';m.textContent=`✓ اتضافت نتيجة ${k.name}: ${a.correct}/${a.total}`;$('#impText').value='';renderAll();};

async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('prep1:'+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){return 'x'+t;}}
const has=!!LS.get('mp1_pin',null);
$('#pinHint').textContent=has?'اكتب الرقم السري (نفس رقم صفحات البنات).':'أول مرة: اختار رقم سري (4 أرقام أو أكتر).';
async function tryPin(){const v=$('#pinIn').value.trim();if(!/^\d{4,8}$/.test(v)){$('#pinMsg').textContent='اكتب من 4 لـ 8 أرقام';return;}
  const h=await sha(v),saved=LS.get('mp1_pin',null);if(!saved)LS.set('mp1_pin',h);else if(saved!==h){$('#pinMsg').textContent='الرقم غلط';return;}
  $('#pin').classList.add('hide');$('#app').classList.remove('hide');tab('all');}
$('#pinBtn').onclick=tryPin;$('#pinIn').onkeydown=e=>{if(e.key==='Enter')tryPin();};
setTimeout(()=>$('#pinIn').focus(),50);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
